name: Debian Cloud Kernel Latest

on:
  workflow_dispatch:
    inputs:
      source_method:
        description: "Source download method (源码获取方式)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - git
      force_build:
        description: "已发布过也强制重新编译 (force rebuild even if released)"
        required: false
        default: false
        type: boolean
  schedule:
    # 避开 UTC 整点：'0 20' 这种整点是 GitHub 定时任务排队高峰，
    # 实测被推迟 3.5h / 7.9h 才真正开跑，挪到非整点能明显改善
    - cron: "23 19 * * 1,4"

env:
  UPLOAD_DIR: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # ★ 编译环境固定在 Debian 12(bookworm) 容器里，不跟随 runner 镜像漂移：
  #   ubuntu-22.04 已于 2026-09-17 弃用、2027-04-17 退役；ubuntu-latest 又正在
  #   从 24.04 迁往 26.04（gcc 15、且 main 里不再有 libncurses5-dev）。
  #   容器内工具链为 gcc 12.2 + binutils 2.40 + debhelper 13.11，与 Debian 目标
  #   发行版一致，bookworm 支持到 2028-06。
  #   宿主仅提供磁盘、docker 和发布所需的 gh，编译本身一律在容器里做。
  BUILD_IMAGE: debian:12-slim
  BUILD_CONTAINER: kernel-builder

permissions:
  contents: write
  actions: write

# 手动触发与定时任务可能撞车，串行化避免同时发 Release
concurrency:
  group: debian-cloud-kernel
  cancel-in-progress: false

jobs:
  check_update:
    # ★ 固定版本标签，不用 ubuntu-latest：latest 正在迁往 26.04，版本判断这一步
    #   只用到 git 与 gh，没有理由把它暴露在镜像漂移下。
    runs-on: ubuntu-24.04
    outputs:
      build_needed: ${{ steps.check.outputs.build_needed }}
      kernel_ver: ${{ steps.check.outputs.kernel_ver }}
    steps:
      - name: Check latest kernel version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # 定时任务触发时 inputs 为空，下面用 :-false 兜底
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail
          kernel_ver=$(git ls-remote --tags https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git | \
            awk -F'refs/tags/v' '/refs\/tags\/v[0-9]+\.[0-9]+(\.[0-9]+)?$/ {print $2}' | \
            sort -V | \
            tail -n 1)

          if [ -z "$kernel_ver" ] || [ "$kernel_ver" == "null" ]; then
            echo "Error: Failed to fetch kernel version from git.kernel.org."
            exit 1
          fi

          # ★ 版本号必须严格形如 7 / 7.1 / 7.1.4。
          #   上面 awk 只保证「整行以数字结尾」，而 -F 切出来的 $2 实际可比版本号宽，
          #   篡改上游响应即可让它带出 $(...) 之类的内容；该值随后被拼进 GITHUB_ENV、
          #   release tag 和 run 脚本，等于宿主 shell 执行面。这里用白名单正则收口。
          if ! [[ "$kernel_ver" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "错误: 版本号格式异常，疑似上游响应被篡改: $kernel_ver"
            exit 1
          fi

          echo "Latest stable kernel version is: $kernel_ver"
          echo "kernel_ver=$kernel_ver" >> $GITHUB_OUTPUT

          # ---- 判断这个版本是否已经发布过 ----
          # ★ 绝对不要写成 `gh release list ... | grep -q ...`：
          #   grep -q 一命中就退出、关掉管道读端，gh 剩下的行写不出去拿到 EPIPE，
          #   被 SIGPIPE 静默打死(退出码 141)，再被 set -o pipefail 放大成「整条管道失败」，
          #   于是 if 判假、走 else，结论变成「没发布过」。
          #   注意只有【命中】时才会错，没命中反而是对的 —— 等于去重永远失效。
          #   2026-08-31 的定时任务就是这样把已经发布过的 7.2.2 又编译发布了一遍。
          # 正确做法：先把输出收进变量(命令替换会把输出读干)，再对变量做匹配。
          # 另外本仓库 release 数量很大，--limit 要留足余量；取不到列表时直接失败
          # (fail-closed)，绝不能默认「没发布过」而去编译。
          # 草稿不算已发布：上传中断后残留的 draft 不能阻止后续自动重试。
          if ! released=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --exclude-drafts \
                            --json tagName --jq '.[].tagName'); then
            echo "Error: 无法获取 Release 列表，为避免重复发布，直接终止。"
            exit 1
          fi

          # -F 固定字符串匹配：tag 里的 . 不该被当成通配符
          if grep -qF "Debian_Kernel_Cloud_${kernel_ver}_bbr_" <<<"$released"; then
            echo "Kernel $kernel_ver has already been released."
            if [ "${FORCE_BUILD:-false}" == "true" ]; then
              echo "force_build=true, forcing rebuild."
              echo "build_needed=true" >> $GITHUB_OUTPUT
            else
              echo "build_needed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Kernel $kernel_ver is new. Build needed."
            echo "build_needed=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check_update
    # 只有当 check_update 判定需要编译时才执行此 Job
    if: needs.check_update.outputs.build_needed == 'true'
    # 宿主仍是实体 runner：清理磁盘、docker、gh 发布都必须在宿主做
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ★ 不要把仓库凭据留在 .git/config 里：
          #   workspace 会整体以读写方式挂进编译容器（容器内以 root 跑上游内核源码的
          #   Makefile），persist-credentials=true 会把 contents:write 的 token 写进
          #   $GITHUB_WORKSPACE/.git/config 的 http.extraheader。本 job 全程不用 git 推送，
          #   直接关掉。
          persist-credentials: false

      - name: Free up disk space (Critical)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      # ★ 为什么用「宿主 + 常驻容器」而不是 job 级 container:：
      #   job 级 container 会把所有 step 塞进容器，导致上面那段磁盘清理删不到东西
      #   （容器里没有 /usr/share/dotnet 等），也无法 docker image prune（无 dockerd）。
      #   内核源码树 + 中间产物要 25GB 以上，宿主磁盘必须真的腾出来。
      - name: Start Debian 12 build container
        run: |
          set -euo pipefail
          ok=false
          for i in 1 2 3; do
            if docker pull "$BUILD_IMAGE"; then ok=true; break; fi
            echo "警告: docker pull 第 ${i} 次失败，10 秒后重试"
            sleep 10
          done
          if [ "$ok" != "true" ]; then
            echo "错误: 无法拉取 $BUILD_IMAGE"
            exit 1
          fi

          docker rm -f "$BUILD_CONTAINER" >/dev/null 2>&1 || true
          docker run -d --name "$BUILD_CONTAINER" \
            --init \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e TZ="$TZ" \
            -e DEBIAN_FRONTEND=noninteractive \
            "$BUILD_IMAGE" sleep infinity

          echo "容器内 Debian 版本: $(docker exec "$BUILD_CONTAINER" cat /etc/debian_version)"
          df -h

      - name: Install Dependencies (Debian 12)
        run: |
          docker exec \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            "$BUILD_CONTAINER" bash -c '
            set -euo pipefail
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential bc bison flex cpio kmod perl python3 passwd \
              libncurses-dev libelf-dev libssl-dev libdw-dev zlib1g-dev \
              dwarves zstd xz-utils wget curl aria2 rsync ca-certificates \
              git dpkg-dev debhelper fakeroot
            rm -rf /var/lib/apt/lists/*

            # ★ 建一个与宿主 runner 同 uid/gid 的构建用户：
            #   apt 必须以 root 装包，但编译和产物要给非 root 跑 —— 容器里跑的
            #   是上游内核源码的 Makefile，而 /work 是宿主 workspace 的读写挂载。
            #   uid 对齐后 /work 天然可写，产物属主也直接就是 runner 用户。
            groupadd -g "$HOST_GID" builder
            useradd -m -u "$HOST_UID" -g "$HOST_GID" -s /bin/bash builder
            if [ "$(id -u builder)" != "$HOST_UID" ]; then
              echo "错误: 构建用户 uid 与宿主不一致"
              exit 1
            fi
            echo "构建用户: $(id builder)"

            # 关键工具链版本打点：以后排查「换镜像导致行为变化」时一眼可见
            echo "--- toolchain ---"
            gcc --version | head -n 1
            ld --version | head -n 1
            make --version | head -n 1
            # 注意 \$ 转义：外层已是单引号，内层 bash 的"双引号"里若不转义，
            # ${Version} 会被内层 shell 当成未定义变量（set -u 直接报错）。
            dpkg-query -W -f="debhelper=\${Version}\n" debhelper
            dpkg-query -W -f="dwarves(pahole)=\${Version}\n" dwarves

            # ★ 说明：dwarves 保留安装仅为将来可能重新打开 CONFIG_DEBUG_INFO_BTF；
            #   当前 kernel-config-common.sh 明确 --disable DEBUG_INFO_BTF，
            #   pahole 版本不参与构建，bookworm 的 1.22 不会成为阻塞项。
          '

      - name: Get Kernel Version & Source
        env:
          KERNEL_VER: ${{ needs.check_update.outputs.kernel_ver }}
          FETCH_METHOD_INPUT: ${{ github.event.inputs.source_method }}
        run: |
          set -euo pipefail
          kernel_ver="$KERNEL_VER"
          # 二次校验（check_update 已验过一遍）：这个值还要拼进 GITHUB_ENV 与 release tag，
          # 不信任上游 job 的产出，本步骤自己再卡一次白名单。
          if ! [[ "$kernel_ver" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "错误: kernel_ver 为空或格式异常: '$kernel_ver'"
            exit 1
          fi
          # 这两个变量必须在宿主写进 GITHUB_ENV：容器内没有 /home/runner/work/_temp
          echo "kernel_ver=$kernel_ver" >> $GITHUB_ENV
          echo "FILE_DATE=Kernel_Debian_Cloud_${kernel_ver}_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

          # 判断获取模式 (定时任务触发时 inputs 为空，默认设为 auto)
          FETCH_METHOD="${FETCH_METHOD_INPUT:-auto}"
          if [ -z "$FETCH_METHOD" ]; then
            FETCH_METHOD="auto"
          fi
          echo "Selected fetch method: $FETCH_METHOD"

          docker exec \
            -u builder \
            -e HOME=/home/builder \
            -e KERNEL_VER="$kernel_ver" \
            -e FETCH_METHOD="$FETCH_METHOD" \
            "$BUILD_CONTAINER" bash -c '
              set -euo pipefail
              # ★ 必须 cd 到挂载点 /work：bindeb-pkg 把 .deb 生成在源码目录的
              #   【上一级】，只有源码在 /work/linux-X 时上一级才是工作区根目录。
              #   若把源码直接挂成 /work 而上一级在容器临时层里，.deb 会随容器消失。
              cd /work

              # 提取主版本号 (例如 7.1.4 提取出 7，用于拼接 CDN 路径 v7.x)
              MAJOR_VER=$(echo "$KERNEL_VER" | cut -d. -f1)
              TARBALL_URL="https://cdn.kernel.org/pub/linux/kernel/v${MAJOR_VER}.x/linux-${KERNEL_VER}.tar.xz"
              GIT_URL="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"

              fetch_tarball() {
                # aria2c 多连接下载：cdn.kernel.org(Fastly) 偶发单流限速/卡顿(日志里 21K/s 那种)，
                # 16 条连接里某条卡住其余仍在跑，实测比 wget 单流稳且快。失败再退回 git clone。
                aria2c -x16 -s16 -k1M --max-tries=3 --retry-wait=3 \
                  --summary-interval=0 --console-log-level=warn \
                  -o linux.tar.xz "$TARBALL_URL"
              }

              if [ "$FETCH_METHOD" = "auto" ]; then
                echo "Downloading via aria2c (16 连接并发，抗单流卡顿): $TARBALL_URL"
                if fetch_tarball; then
                  echo "Download OK. Extracting tarball..."
                  # --no-same-owner/--no-same-permissions：tarball 里的属主/权限位
                  # 一律不还原，避免上游包通过元数据在容器内造出奇怪的文件。
                  if tar -xf linux.tar.xz --no-same-owner --no-same-permissions; then
                    rm -f linux.tar.xz
                  else
                    echo "Warning: 解压失败(下载可能损坏)，回退 Git clone..."
                    rm -f linux.tar.xz
                    rm -rf "linux-${KERNEL_VER}"
                    git clone --depth 1 --branch "v${KERNEL_VER}" "$GIT_URL" "linux-${KERNEL_VER}"
                  fi
                else
                  echo "Warning: aria2c download failed! Falling back to Git clone..."
                  rm -f linux.tar.xz
                  git clone --depth 1 --branch "v${KERNEL_VER}" "$GIT_URL" "linux-${KERNEL_VER}"
                fi
              else
                echo "Manual override: Forcing Git clone from $GIT_URL..."
                git clone --depth 1 --branch "v${KERNEL_VER}" "$GIT_URL" "linux-${KERNEL_VER}"
              fi

              # 源码目录必须真的存在，否则后面 cd 会以一个诡异的错误失败
              if [ ! -d "/work/linux-${KERNEL_VER}" ]; then
                echo "错误: 源码目录 linux-${KERNEL_VER} 不存在，源码获取失败"
                exit 1
              fi
              echo "内核源码就绪: $(du -sh "/work/linux-${KERNEL_VER}" | cut -f1)"
            '

      - name: Configure Kernel (Debian/Ubuntu Cloud & Panel Optimized)
        env:
          KERNEL_VER: ${{ needs.check_update.outputs.kernel_ver }}
        run: |
          docker exec \
            -u builder \
            -e HOME=/home/builder \
            -e KERNEL_VER="$KERNEL_VER" \
            "$BUILD_CONTAINER" bash -c '
              set -euo pipefail
              cd "/work/linux-${KERNEL_VER}"

              make x86_64_defconfig

              # ---- 公共配置：与 CentOS 流水线共用同一份权威来源，杜绝漂移 ----
              bash /work/kernel-config-common.sh apply

              # ==========================================
              # Debian 专属：原生 AppArmor 安全链
              # 这是与 CentOS 唯一真正需要区分的地方
              # ==========================================
              scripts/config --enable CONFIG_SECURITY_APPARMOR
              scripts/config --enable CONFIG_SECURITY_APPARMOR_BOOTPARAM
              scripts/config --enable CONFIG_DEFAULT_SECURITY_APPARMOR
              scripts/config --enable CONFIG_SECURITY_APPARMOR_HASH    # 加快开机策略加载
              # 严格匹配 Debian 12 默认的 LSM 加载顺序
              scripts/config --set-str CONFIG_LSM "landlock,lockdown,yama,loadpin,safesetid,integrity,apparmor,bpf"

              # 生成最终内核配置
              make olddefconfig

              # ---- 关键：校验配置真的生效 ----
              # olddefconfig 会静默丢弃依赖不满足的选项，不校验就等于盲编
              bash /work/kernel-config-common.sh verify debian
            '

      - name: Compile Kernel
        env:
          KERNEL_VER: ${{ needs.check_update.outputs.kernel_ver }}
        run: |
          set -euo pipefail
          docker exec \
            -u builder \
            -e HOME=/home/builder \
            -e KERNEL_VER="$KERNEL_VER" \
            "$BUILD_CONTAINER" bash -c '
              set -euo pipefail
              cd "/work/linux-${KERNEL_VER}"
              echo "$(nproc) thread compile"

              # ★ 以非 root 的 builder 用户编译（uid 与宿主 runner 一致）：
              #   容器里执行的是上游内核源码的 Makefile，而 /work 是宿主 workspace 的
              #   读写挂载，没必要给它 root。也正因为不用 root，才不需要 sudo ——
              #   原先那次「Permission denied 被迫 -j1 打包」的根因就是 sudo 造出的
              #   root 属主文件，这里从根上没有这个问题。
              #   （若某天 bindeb-pkg 在并行下出现竞态，把下面的 -j$(nproc) 改回 -j1 即可）
              time make -j"$(nproc)"
              time make -j"$(nproc)" bindeb-pkg KDEB_COMPRESS=xz

              mkdir -p /work/upload

              # bindeb-pkg 把 .deb 生成在源码目录的【上一级】= /work
              shopt -s nullglob
              debs=(/work/*.deb)
              if [ "${#debs[@]}" -eq 0 ]; then
                echo "错误: bindeb-pkg 没有产出任何 .deb 包，构建视为失败"
                exit 1
              fi
              mv "${debs[@]}" /work/upload/
              ls -lh /work/upload/
            '

          # ★ 产物非空校验（宿主侧再验一次）：防止发布一个没有任何文件的空 Release
          deb_count=$(find "$GITHUB_WORKSPACE/upload" -type f -name '*.deb' | wc -l)
          if [ "$deb_count" -eq 0 ]; then
            echo "错误: 没有产出任何 .deb 包，构建视为失败"
            exit 1
          fi
          echo "已产出 ${deb_count} 个 deb 包:"
          ls -lh "$GITHUB_WORKSPACE/upload/"
          df -h

          echo "compile_status=success" >> $GITHUB_ENV

      # 编译已改由非 root 的 builder（uid/gid 与宿主 runner 相同）执行，产物属主天然正确；
      # 这一步留作兜底（例如将来某步误用 root 重建了 upload/），保证 artifact 归档与
      # Release 上传不会撞上 Permission denied。
      - name: Fix ownership of build outputs
        if: ${{ always() }}
        run: |
          # ★ 只处理 upload/ 自身与其下第一层的常规文件/目录，不用 chown -R：
          #   upload/ 里的内容是容器（root、跑不可信源码）创建的，若出现
          #   upload/xxx -> /etc/shadow 这类符号链接，-R 递归会跟进去改目标属主。
          #   -h 进一步保证即便匹配到链接也只改链接自身。
          if [ -d "$GITHUB_WORKSPACE/upload" ]; then
            sudo find "$GITHUB_WORKSPACE/upload" -maxdepth 1 \( -type f -o -type d \) \
              -exec chown -h "$(id -u):$(id -g)" {} +
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: ${{ env.compile_status == 'success' && env.UPLOAD_DIR == 'true' }}
        with:
          name: ${{ env.FILE_DATE }}
          path: ${{ github.workspace }}/upload/

      - name: Generate release tag and notes
        if: ${{ env.UPLOAD_RELEASE == 'true' && env.compile_status == 'success' && !cancelled() }}
        run: |
          set -euo pipefail
          echo "release_tag=Debian_Kernel_Cloud_${{ env.kernel_ver }}_bbr_$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV
          cat > release.txt <<EOF
          ## Debian / Ubuntu 系云内核 ${{ env.kernel_ver }}

          面向 VPS，兼容轻量 NAS、PVE、软路由。默认启用 BBR + FQ。

          ### 安装
          \`\`\`bash
          sudo dpkg -i linux-image-*.deb linux-headers-*.deb
          # 开机默认启用 BBR + FQ(内核已内建 BBR，FQ 队列用 sysctl 开启最稳妥)
          echo -e "net.core.default_qdisc=fq\nnet.ipv4.tcp_congestion_control=bbr" | sudo tee /etc/sysctl.d/99-bbr.conf
          sudo sysctl --system
          sudo update-grub
          sudo reboot
          \`\`\`

          ### 主要特性
          - 拥塞控制默认 BBR(已内建)；FQ 队列建议用上面的 sysctl 开启
          - 全云平台驱动：KVM/virtio、Xen、Hyper-V、VMware、AWS ENA/Nitro、GCP GVE
          - 容器全栈：Docker/Podman 所需 overlayfs、cgroup、netfilter NAT 全开
          - PVE 宿主：KVM、VFIO 直通、IOMMU、OVS、VLAN、LVM Thin
          - 防火墙：nftables + iptables + ipset + AppArmor
          - 内存优化：MGLRU、DAMON、ZRAM/ZSWAP
          - 模块采用 XZ 压缩，兼容 Debian 10/11 等 kmod < 29 的系统

          > 构建时已自动校验关键配置项均真实生效。
          > 为保持精简，未启用 BTF，不提供 BPF LSM 策略加载支持；AppArmor 不受影响。
          > 编译环境：Debian 12 (bookworm) 容器，gcc 12.2 / binutils 2.40。
          EOF

      - name: Upload Kernel to Release
        if: ${{ env.UPLOAD_RELEASE == 'true' && env.compile_status == 'success' && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ env.release_tag }}" \
            "$GITHUB_WORKSPACE"/upload/* \
            --title "Debian Cloud Kernel ${{ env.kernel_ver }} (BBR)" \
            --notes-file release.txt

      # 只清理本流水线自己产出的 Release，保留最新 3 份，Release 和 tag 一起删
      - name: Prune old releases
        if: ${{ env.UPLOAD_RELEASE == 'true' && env.compile_status == 'success' && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PREFIX: Debian_Kernel_Cloud_
          KEEP: 3
        run: |
          set -euo pipefail
          # ★ 同样不用 `gh ... | grep -q` 这种会提前退出的管道：读端一关，gh 就吃 EPIPE
          #   被 SIGPIPE 打死(141)，pipefail 再把整条管道判失败。下面的 awk/sort/tail/cut
          #   都会把输入读干，不会触发。取不到列表就跳过清理——产物已发布成功，不该让 job 变红。
          if ! all=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 \
                       --json tagName,publishedAt --jq '.[] | [.publishedAt, .tagName] | @tsv'); then
            echo "警告: 无法获取 Release 列表，跳过本次清理（本次发布已成功，不影响产物）"
            exit 0
          fi

          # 用「前缀 + 纯数字版本 + _bbr_」精确锚定本流水线产物：不会误伤 Centos_Kernel_* /
          # Ubuntu_Kernel_* 等历史前缀，也不会误伤将来可能出现的 arm64（arm64 不是数字）。
          # 按 publishedAt 排序：createdAt 取的是 tag 所指 commit 的日期，会大量重复、排序不稳。
          stale=$(printf '%s\n' "$all" \
            | awk -F'\t' -v pfx="$RELEASE_PREFIX" '$2 ~ "^" pfx "[0-9]+([.][0-9]+)*_bbr_"' \
            | sort -r \
            | tail -n +"$((KEEP + 1))" \
            | cut -f2)

          if [ -z "$stale" ]; then
            echo "${RELEASE_PREFIX}* 的 Release 未超过 ${KEEP} 份，无需清理。"
            exit 0
          fi

          echo "保留最新 ${KEEP} 份，以下 $(printf '%s\n' "$stale" | wc -l) 个旧 Release 将连同 tag 一并删除:"
          printf '  %s\n' "$stale"

          printf '%s\n' "$stale" | while read -r tag; do
            [ -n "$tag" ] || continue
            # 单个失败不影响其余，也不让整个 job 变红（产物已经发出去了）
            if gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag; then
              echo "  已删除 release + tag: $tag"
            else
              echo "  警告: $tag 删除失败，跳过"
            fi
            sleep 1   # GitHub 对写操作有二级限流，间隔 1s 最稳
          done

      # 用 gh CLI 清理，替代 Mattraks/delete-workflow-runs（老 Node20 action）
      - name: Prune old workflow runs
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 保留最近 3 次运行。注意代价：出问题时日志会很快被自己删掉，
          # 这次定位 7.2.2 重复编译就因为相关运行记录已被清掉而断过线索
          # —— 真出问题要当天就看日志、必要时先下载 artifact 留证。
          echo "保留最近 3 次运行，其余删除（进行中的当前 run 会被自动跳过）"
          gh run list --workflow "${{ github.workflow }}" --limit 200 \
            --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].databaseId' \
            | while read -r id; do
                [ -n "$id" ] || continue
                echo "  删除 run: $id"
                gh run delete "$id" || true
              done

      - name: Stop build container
        if: ${{ always() }}
        run: docker rm -f "$BUILD_CONTAINER" || true
